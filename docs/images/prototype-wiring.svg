<text x="500" y="410" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">gpio-key · rotary-encoder</text>
<text x="500" y="430" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">encoder A on GPIO7</text>
<text x="500" y="450" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">USB × 2 to the Picos</text>
