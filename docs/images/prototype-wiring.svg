<text x="155.0" y="290" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">CAN_0: SPI0 CE0 · INT GPIO25</text>
<text x="155.0" y="308" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">CAN_1: SPI1 CE0 · INT GPIO24</text>
<text x="155.0" y="326" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#555555">jumpers: 3.3 V logic · 120 Ω off</text>
