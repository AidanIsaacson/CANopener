# docker compose up -d --build   (from this folder; settings in .env, captures in ./data)
# First:  mkdir -p data && sudo chown 10001 data   (the container doesn't run as root)
services:
  canopener-upload:
    build: .
    container_name: canopener-upload
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    # Only nginx on this host reaches it; the outside world comes in through the Cloudflare tunnel.
    ports:
      - "127.0.0.1:8087:8080"

  # Optional: the SSH tunnel beside remote help (README, "SSH tunnel"). Start it with
  #   docker compose --profile tunnel up -d --build
  # It uses the host's network, so a unit's tunnel ends on this host's own 127.0.0.1 and nowhere else.
  canopener-tunnel:
    profiles: ["tunnel"]
    build: ./tunnel
    container_name: canopener-tunnel
    restart: unless-stopped
    network_mode: host
    environment:
      - TUNNEL_PORT=${TUNNEL_PORT:-47822}
    volumes:
      - ./data/tunnel:/keys:ro
      - ./tunnel-hostkeys:/hostkeys
