[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "canopener"
dynamic = ["version"]
description = "Open-source J1939 / CAN diagnostics for equipment and vehicles"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-2.0-or-later" }
dependencies = []          # the core and CLI are standard-library only

[project.optional-dependencies]
# 6.12.0 crashes at interpreter exit on Python < 3.12 ("none_dealloc"); 6.11 and earlier are fine.
gui = ["PySide6-Essentials>=6.5,!=6.12.0"]
dev = ["pytest>=7", "ruff>=0.4"]
# The handheld's instrument UI (canopener-device). pygame-ce and pygame both work (2.1+);
# on a Pi with no desktop, Raspberry Pi OS's python3-pygame is the safe choice (see docs/DEVICE.md).
device = ["pygame-ce>=2.4"]
# Adapters Linux can't show as can0, through python-can (LGPL-3.0): PEAK, Kvaser, Vector, IXXAT,
# slcan on a serial port ... (vendor drivers separately). gs_usb / candleLight without the Linux
# driver: pip install "python-can[gs-usb]" (needs libusb). See can/pythoncan.py.
adapters = ["python-can[serial]>=4.3"]

[project.scripts]
canopener = "canopener.gui.app:main"
canopener-cli = "canopener.cli:main"
canopener-device = "canopener.device.app:main"

[tool.setuptools.dynamic]
version = { attr = "canopener.__version__" }

[tool.setuptools.packages.find]
include = ["canopener*"]

[tool.setuptools.package-data]
canopener = ["profiles/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]  # zip(strict=) is noise here

[tool.ruff.lint.per-file-ignores]
"canopener/obd/dtc_codes.py" = ["E501"]   # generated data table
